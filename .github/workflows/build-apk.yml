name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install CMake 3.18.1 (pinned by flutter_llama's native build)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.18.1"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish to the Candy-Cooler tag/release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Candy-Cooler
          name: Candy Cooler
          files: build/app/outputs/flutter-apk/app-debug.apk
          generate_release_notes: false
          make_latest: true
